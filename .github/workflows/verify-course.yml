name: Course materials
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python tools/verify_course.py ${{ github.event.repository.fork && '--student-work' || '' }}
      - run: python -m unittest discover -s tests -v
      - run: node --check materials/labs/review-candidate.mjs
